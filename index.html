<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI記事トレンド | 毎日更新</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Hiragino Kaku Gothic Pro', sans-serif; background: #0d0d0d; color: #e8e8e8; min-height: 100vh; }

  /* ヘッダー */
  .header { background: #111; border-bottom: 1px solid #222; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
  .logo span { color: #1d9bf0; }
  .header-meta { font-size: 12px; color: #666; }

  /* 日付タブ */
  .date-tabs { display: flex; gap: 0; padding: 0 24px; background: #111; border-bottom: 1px solid #222; overflow-x: auto; }
  .date-tab { padding: 12px 20px; font-size: 13px; cursor: pointer; color: #666; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.2s; }
  .date-tab:hover { color: #ccc; }
  .date-tab.active { color: #1d9bf0; border-bottom-color: #1d9bf0; }
  .date-tab .count { background: #1d9bf0; color: white; font-size: 10px; padding: 1px 5px; border-radius: 8px; margin-left: 4px; }

  /* フィルターバー */
  .filter-bar { padding: 12px 24px; display: flex; gap: 8px; overflow-x: auto; background: #0d0d0d; border-bottom: 1px solid #1a1a1a; }
  .filter-btn { padding: 5px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #333; background: transparent; color: #888; transition: all 0.2s; white-space: nowrap; }
  .filter-btn:hover { border-color: #1d9bf0; color: #1d9bf0; }
  .filter-btn.active { background: #1d9bf0; border-color: #1d9bf0; color: white; }

  /* メインレイアウト */
  .main { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }

  /* 統計バナー */
  .stats-bar { display: flex; gap: 20px; padding: 12px 0 20px; }
  .stat { text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; color: #1d9bf0; }
  .stat-label { font-size: 11px; color: #555; }

  /* 記事グリッド */
  .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

  /* 記事カード */
  .article-card { background: #111; border: 1px solid #222; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.2s; }
  .article-card:hover { border-color: #1d9bf0; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(29,155,240,0.1); }

  .card-header { padding: 14px 16px 0; display: flex; justify-content: space-between; align-items: flex-start; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 8px; }
  .tag-claude { background: rgba(255,140,0,0.15); color: #ff8c00; }
  .tag-chatgpt { background: rgba(16,163,127,0.15); color: #10a37f; }
  .tag-gemini { background: rgba(66,133,244,0.15); color: #4285f4; }
  .tag-github { background: rgba(110,84,148,0.15); color: #9966cc; }
  .tag-ai { background: rgba(29,155,240,0.15); color: #1d9bf0; }
  .tag-skill { background: rgba(255,193,7,0.15); color: #ffc107; }
  .tag-default { background: rgba(255,255,255,0.08); color: #888; }
  .card-region { font-size: 11px; color: #555; white-space: nowrap; margin-left: 6px; }

  .card-body { padding: 12px 16px; }
  .card-title { font-size: 14px; font-weight: 700; color: #e8e8e8; line-height: 1.5; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-preview { font-size: 12px; color: #666; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .card-footer { padding: 10px 16px 14px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1a1a1a; margin-top: 10px; }
  .card-author { display: flex; align-items: center; gap: 6px; }
  .author-avatar { width: 20px; height: 20px; border-radius: 50%; background: #1d9bf0; display: flex; align-items: center; justify-content: center; font-size: 9px; color: white; font-weight: 700; flex-shrink: 0; }
  .author-name { font-size: 11px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
  .card-stats { display: flex; gap: 10px; }
  .stat-item { font-size: 11px; color: #555; display: flex; align-items: center; gap: 3px; }
  .stat-item.hot { color: #e94560; }

  /* カテゴリバッジ */
  .category-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; margin-bottom: 6px; display: inline-block; }
  .cat-ai { background: rgba(29,155,240,0.2); color: #1d9bf0; }
  .cat-github { background: rgba(110,84,148,0.2); color: #9966cc; }
  .cat-skill { background: rgba(255,193,7,0.2); color: #ffc107; }

  /* 翻訳バッジ */
  .translated-badge { font-size: 10px; color: #555; margin-left: 4px; }

  /* 空状態 */
  .empty { text-align: center; padding: 60px 20px; color: #444; }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* モーダル */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #111; border: 1px solid #333; border-radius: 16px; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal-header { padding: 20px 20px 0; display: flex; justify-content: space-between; }
  .modal-close { background: none; border: none; color: #666; font-size: 20px; cursor: pointer; }
  .modal-body { padding: 20px; }
  .modal-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 12px; line-height: 1.5; }
  .modal-text { font-size: 14px; color: #aaa; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
  .modal-footer { padding: 16px 20px; border-top: 1px solid #222; display: flex; gap: 10px; }
  .btn-x { background: #1d9bf0; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .btn-x:hover { background: #1a8cd8; }

  /* ローディング */
  .loading { text-align: center; padding: 40px; color: #444; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">AI<span>BUZZ</span> 📡</div>
  <div class="header-meta" id="updateTime">読み込み中...</div>
</div>

<div class="date-tabs" id="dateTabs"></div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-filter="all">すべて</button>
  <button class="filter-btn" data-filter="Claude">Claude</button>
  <button class="filter-btn" data-filter="ChatGPT">ChatGPT</button>
  <button class="filter-btn" data-filter="Gemini">Gemini</button>
  <button class="filter-btn" data-filter="GitHub">GitHub/OSS</button>
  <button class="filter-btn" data-filter="AIエージェント">AIエージェント</button>
  <button class="filter-btn" data-filter="プロンプト">プロンプト</button>
  <button class="filter-btn" data-filter="自動化">自動化</button>
  <button class="filter-btn" data-filter="🌍 海外">🌍 海外</button>
  <button class="filter-btn" data-filter="🇯🇵 日本">🇯🇵 日本</button>
</div>

<div class="main">
  <div class="stats-bar" id="statsBar"></div>
  <div class="articles-grid" id="articlesGrid">
    <div class="loading">🔄 記事を読み込んでいます...</div>
  </div>
</div>

<!-- モーダル -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div></div>
      <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-text" id="modalText"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-x" id="modalXLink" onclick="window.open(this.dataset.url,'_blank')">Xで見る →</button>
    </div>
  </div>
</div>

<script>
let allArticles = [];
let currentDate = '';
let currentFilter = 'all';

function getTagClass(tag) {
  if (['Claude','Anthropic'].includes(tag)) return 'tag-claude';
  if (['ChatGPT','OpenAI','GPT-4'].includes(tag)) return 'tag-chatgpt';
  if (['Gemini','Google'].includes(tag)) return 'tag-gemini';
  if (['GitHub','OSS'].includes(tag)) return 'tag-github';
  if (['プロンプト','スキル','自動化','AIコーディング'].includes(tag)) return 'tag-skill';
  if (['AI','LLM','AIエージェント'].includes(tag)) return 'tag-ai';
  return 'tag-default';
}

function getCategoryClass(cat) {
  if (cat === 'GitHub/OSS') return 'cat-github';
  if (cat === 'スキル系') return 'cat-skill';
  return 'cat-ai';
}

function formatNum(n) {
  if (!n) return '0';
  if (n >= 10000) return (n/10000).toFixed(1) + '万';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toString();
}

function renderCard(a) {
  const tags = (a.tags || []).slice(0, 3).map(t => 
    `<span class="tag ${getTagClass(t)}">${t}</span>`
  ).join('');
  const translated = a.translated ? '<span class="translated-badge">🌐JP訳</span>' : '';
  return `
    <div class="article-card" onclick="openModal(${JSON.stringify(a.id)})">
      <div class="card-header">
        <div class="card-tags">${tags}</div>
        <div class="card-region">${a.region || ''}</div>
      </div>
      <div class="card-body">
        <div class="category-badge ${getCategoryClass(a.category)}">${a.category || 'AI系'}</div>${translated}
        <div class="card-title">${a.title || a.preview || ''}</div>
        <div class="card-preview">${(a.preview || '').replace(/https?:\/\/\S+/g,'')}</div>
      </div>
      <div class="card-footer">
        <div class="card-author">
          <div class="author-avatar">${(a.author_name||'?')[0]}</div>
          <div class="author-name">@${a.author_screen_name||''}</div>
        </div>
        <div class="card-stats">
          ${a.likes > 1000 ? `<div class="stat-item hot">❤️ ${formatNum(a.likes)}</div>` : `<div class="stat-item">♥ ${formatNum(a.likes)}</div>`}
          <div class="stat-item">🔁 ${formatNum(a.retweets)}</div>
          ${a.views ? `<div class="stat-item">👁 ${formatNum(a.views)}</div>` : ''}
        </div>
      </div>
    </div>`;
}

function renderGrid() {
  let filtered = allArticles.filter(a => a.date === currentDate);
  if (currentFilter !== 'all') {
    filtered = filtered.filter(a => {
      if (currentFilter === '🌍 海外') return a.region === '🌍 海外';
      if (currentFilter === '🇯🇵 日本') return a.region === '🇯🇵 日本';
      return (a.tags || []).includes(currentFilter);
    });
  }
  filtered.sort((a,b) => (b.likes||0) - (a.likes||0));
  
  const grid = document.getElementById('articlesGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>該当する記事がありません</div>';
    return;
  }
  grid.innerHTML = filtered.map(renderCard).join('');
  
  // 統計更新
  const stats = document.getElementById('statsBar');
  const total = filtered.length;
  const overseas = filtered.filter(a => a.region === '🌍 海外').length;
  const jp = filtered.filter(a => a.region === '🇯🇵 日本').length;
  const maxLikes = Math.max(...filtered.map(a => a.likes||0));
  stats.innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">記事数</div></div>
    <div class="stat"><div class="stat-num">${overseas}</div><div class="stat-label">海外</div></div>
    <div class="stat"><div class="stat-num">${jp}</div><div class="stat-label">日本</div></div>
    <div class="stat"><div class="stat-num">${formatNum(maxLikes)}</div><div class="stat-label">最高いいね</div></div>
  `;
}

function openModal(id) {
  const a = allArticles.find(x => x.id === id);
  if (!a) return;
  document.getElementById('modalTitle').textContent = a.title || '';
  document.getElementById('modalText').textContent = a.body || a.preview || '';
  document.getElementById('modalXLink').dataset.url = a.url || '#';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

// フィルターボタン
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGrid();
  });
});

// データ読み込み
fetch('./site_data.json')
  .then(r => r.json())
  .then(data => {
    allArticles = data;
    
    // 日付リスト
    const dates = [...new Set(data.map(a => a.date).filter(Boolean))].sort().reverse();
    if (dates.length > 0) currentDate = dates[0];
    
    // 日付タブ描画
    const tabsEl = document.getElementById('dateTabs');
    tabsEl.innerHTML = dates.map(d => {
      const count = data.filter(a => a.date === d).length;
      const label = d === new Date().toISOString().slice(0,10) ? `今日 ${d}` :
                    d === new Date(Date.now()-86400000).toISOString().slice(0,10) ? `昨日 ${d}` : d;
      return `<div class="date-tab ${d === currentDate ? 'active' : ''}" data-date="${d}">
        ${label}<span class="count">${count}</span>
      </div>`;
    }).join('');
    
    document.querySelectorAll('.date-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentDate = tab.dataset.date;
        renderGrid();
      });
    });
    
    // 更新時刻
    const now = new Date();
    document.getElementById('updateTime').textContent = 
      `最終更新: ${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} JST`;
    
    renderGrid();
  })
  .catch(e => {
    document.getElementById('articlesGrid').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>データの読み込みに失敗しました</div>';
  });
</script>
</body>
</html>
