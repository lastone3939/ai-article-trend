<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X 記事型広告まとめ | Claude Code Research</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#fafafa;color:#1a1a1a;line-height:1.7}
a{color:#1d9bf0;text-decoration:none}
a:hover{text-decoration:underline}

/* ヘッダー */
.header{background:#fff;border-bottom:1px solid #e8e8e8;padding:20px 0;position:sticky;top:0;z-index:100}
.header-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;font-weight:700;color:#1a1a1a}
.header h1 span{color:#1d9bf0}
.header-meta{font-size:13px;color:#666}

/* コントロール */
.controls{max-width:1200px;margin:20px auto;padding:0 20px}
.sort-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sort-bar label{font-size:13px;font-weight:600;color:#555;margin-right:4px}
.sort-btn{padding:6px 14px;border:1px solid #ddd;border-radius:20px;background:#fff;font-size:13px;cursor:pointer;transition:all .2s}
.sort-btn:hover{border-color:#1d9bf0;color:#1d9bf0}
.sort-btn.active{background:#1d9bf0;color:#fff;border-color:#1d9bf0}
.tag-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag-btn{padding:4px 12px;border:1px solid #d0e8ff;border-radius:14px;background:#eef6ff;color:#1d6fb0;font-size:12px;cursor:pointer;transition:all .2s}
.tag-btn:hover{background:#d0e8ff}
.tag-btn.active{background:#1d9bf0;color:#fff;border-color:#1d9bf0}

/* グリッド */
.grid{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}}
@media(max-width:560px){.grid{grid-template-columns:1fr;gap:16px}}

/* カード */
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .2s,box-shadow .2s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.card-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e9ecef}
.card-body{padding:16px}
.card-title{font-size:16px;font-weight:700;line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-author{display:flex;align-items:center;gap:6px;font-size:13px;color:#555;margin-bottom:10px}
.card-author .followers{color:#999;font-size:12px}
.card-stats{display:flex;gap:14px;font-size:13px;color:#666;margin-bottom:10px;flex-wrap:wrap}
.card-stats span{display:flex;align-items:center;gap:3px}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{padding:2px 8px;border-radius:10px;background:#eef6ff;color:#1d6fb0;font-size:11px}
.card-preview{font-size:13px;color:#555;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.read-btn{display:inline-block;padding:6px 16px;border:1px solid #1d9bf0;border-radius:20px;color:#1d9bf0;font-size:13px;font-weight:500;transition:all .2s}
.read-btn:hover{background:#1d9bf0;color:#fff;text-decoration:none}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;justify-content:center;align-items:flex-start;overflow-y:auto;padding:40px 20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:720px;width:100%;margin:auto;overflow:hidden;position:relative;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .2s}
.modal-close:hover{background:rgba(0,0,0,.7)}
.modal-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e9ecef}
.modal-content{padding:28px}
.modal-title{font-size:22px;font-weight:700;line-height:1.4;margin-bottom:12px}
.modal-author{display:flex;align-items:center;gap:8px;font-size:14px;color:#555;margin-bottom:6px}
.modal-stats{display:flex;gap:16px;font-size:14px;color:#666;margin-bottom:16px;flex-wrap:wrap}
.modal-stats span{display:flex;align-items:center;gap:4px}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.modal-body{font-size:15px;line-height:1.9;color:#333;word-break:break-word}
.modal-body a{color:#1d9bf0;word-break:break-all}
.modal-footer{margin-top:24px;padding-top:16px;border-top:1px solid #eee;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.x-link{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;background:#000;color:#fff;border-radius:24px;font-size:14px;font-weight:500;transition:opacity .2s}
.x-link:hover{opacity:.85;text-decoration:none;color:#fff}
.modal-date{font-size:13px;color:#999}

/* プレースホルダー */
.placeholder-img{width:100%;aspect-ratio:16/9;background:#e9ecef;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px}

/* 件数表示 */
.result-count{max-width:1200px;margin:0 auto;padding:0 20px;font-size:13px;color:#888}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <h1><span>X</span> 記事型広告まとめ</h1>
    <div class="header-meta">Claude Code × AI記事リサーチ</div>
  </div>
</header>

<div class="controls">
  <div class="sort-bar">
    <label>並び替え:</label>
    <button class="sort-btn active" data-sort="likes">&#10084;&#65039; いいね数</button>
    <button class="sort-btn" data-sort="bookmarks">&#128278; ブックマーク</button>
    <button class="sort-btn" data-sort="views">&#128065; 表示数</button>
  </div>
  <div class="tag-bar" id="tagBar">
    <label style="font-size:13px;font-weight:600;color:#555;margin-right:4px">タグ:</label>
  </div>
</div>

<div class="result-count" id="resultCount"></div>
<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<script>
(function(){
  let articles = [];
  let currentSort = 'likes';
  let activeTag = null;

  function fmt(n){
    if(n==null) return '0';
    if(n >= 1e6) return (n/1e6).toFixed(1)+'M';
    if(n >= 1e3) return (n/1e3).toFixed(1)+'K';
    return String(n);
  }

  function esc(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function linkify(text){
    return text.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  function formatBody(text){
    var escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return linkify(escaped).replace(/\n/g,'<br>');
  }

  function onImgError(img){
    var div = document.createElement('div');
    div.className = 'placeholder-img';
    div.textContent = 'No Image';
    img.replaceWith(div);
  }

  function renderCard(a){
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<img class="card-img" src="'+(a.cover_url||'')+'" alt="" loading="lazy">'+
      '<div class="card-body">'+
        '<div class="card-title">'+esc(a.title)+'</div>'+
        '<div class="card-author">'+
          '<strong>'+esc(a.author_name)+'</strong>'+
          '<span class="followers">@'+esc(a.author_screen_name)+' · '+fmt(a.author_followers)+'フォロワー</span>'+
        '</div>'+
        '<div class="card-stats">'+
          '<span>\u2764\uFE0F '+fmt(a.likes)+'</span>'+
          '<span>\uD83D\uDD16 '+fmt(a.bookmarks)+'</span>'+
          '<span>\uD83D\uDC41 '+fmt(a.views)+'</span>'+
        '</div>'+
        '<div class="card-tags">'+(a.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>'+
        '<div class="card-preview">'+esc(a.preview||'')+'</div>'+
        '<span class="read-btn">\u5168\u6587\u3092\u8AAD\u3080 \u2192</span>'+
      '</div>';
    var img = card.querySelector('.card-img');
    if(!a.cover_url){ onImgError(img); }
    else { img.onerror = function(){ onImgError(this); }; }
    card.addEventListener('click', function(){ openModal(a); });
    return card;
  }

  function openModal(a){
    var overlay = document.getElementById('modalOverlay');
    var modal = document.getElementById('modal');
    var dateStr = a.created_at ? new Date(a.created_at).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}) : '';
    modal.innerHTML =
      '<button class="modal-close" id="modalClose">\u2715</button>'+
      '<img class="modal-img" src="'+(a.cover_url||'')+'" alt="">'+
      '<div class="modal-content">'+
        '<h2 class="modal-title">'+esc(a.title)+'</h2>'+
        '<div class="modal-author">'+
          '<strong>'+esc(a.author_name)+'</strong>'+
          '<span>@'+esc(a.author_screen_name)+' · '+fmt(a.author_followers)+'\u30D5\u30A9\u30ED\u30EF\u30FC</span>'+
        '</div>'+
        '<div class="modal-stats">'+
          '<span>\u2764\uFE0F '+fmt(a.likes)+'</span>'+
          '<span>\uD83D\uDD01 '+fmt(a.retweets)+'</span>'+
          '<span>\uD83D\uDD16 '+fmt(a.bookmarks)+'</span>'+
          '<span>\uD83D\uDC41 '+fmt(a.views)+'</span>'+
        '</div>'+
        '<div class="modal-tags">'+(a.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>'+
        '<div class="modal-body">'+formatBody(a.body||'')+'</div>'+
        '<div class="modal-footer">'+
          '<a class="x-link" href="'+a.url+'" target="_blank" rel="noopener">\uD835\uDD4F \u3067\u898B\u308B</a>'+
          '<span class="modal-date">'+dateStr+'</span>'+
        '</div>'+
      '</div>';
    var img = modal.querySelector('.modal-img');
    if(!a.cover_url){ onImgError(img); }
    else { img.onerror = function(){ onImgError(this); }; }
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('modalClose').addEventListener('click', closeModal);
  }

  function closeModal(){
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function render(){
    var filtered = activeTag ? articles.filter(function(a){ return (a.tags||[]).indexOf(activeTag)!==-1; }) : articles.slice();
    filtered.sort(function(a,b){ return (b[currentSort]||0)-(a[currentSort]||0); });
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    filtered.forEach(function(a){ grid.appendChild(renderCard(a)); });
    document.getElementById('resultCount').textContent = filtered.length+'\u4EF6\u306E\u8A18\u4E8B';
  }

  function buildTags(){
    var tagSet = {};
    articles.forEach(function(a){ (a.tags||[]).forEach(function(t){ tagSet[t]=true; }); });
    var tags = Object.keys(tagSet).sort();
    var bar = document.getElementById('tagBar');
    var allBtn = document.createElement('button');
    allBtn.className = 'tag-btn active';
    allBtn.textContent = '\u3059\u3079\u3066';
    allBtn.addEventListener('click', function(){
      activeTag = null;
      bar.querySelectorAll('.tag-btn').forEach(function(b){ b.classList.remove('active'); });
      allBtn.classList.add('active');
      render();
    });
    bar.appendChild(allBtn);
    tags.forEach(function(tag){
      var btn = document.createElement('button');
      btn.className = 'tag-btn';
      btn.textContent = tag;
      btn.addEventListener('click', function(){
        activeTag = tag;
        bar.querySelectorAll('.tag-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        render();
      });
      bar.appendChild(btn);
    });
  }

  document.querySelectorAll('.sort-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentSort = btn.dataset.sort;
      document.querySelectorAll('.sort-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      render();
    });
  });

  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if(e.target===e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') closeModal();
  });

  fetch('site_data.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      articles = data;
      buildTags();
      render();
    })
    .catch(function(){
      document.getElementById('grid').innerHTML = '<p style="padding:40px;text-align:center;color:#999">\u30C7\u30FC\u30BF\u306E\u8AAD\u307F\u8FBC\u307F\u306B\u5931\u6557\u3057\u307E\u3057\u305F</p>';
    });
})();
</script>
</body>
</html>
